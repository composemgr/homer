# nginx proxy address - http://172.17.0.1:64202

name: homer
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: b4bz/homer:latest
    container_name: homer-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: homer-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose -Y off --tries=1 --spider http://127.0.0.1:$${PORT}/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64202:8080'
    volumes:
      - './volumes/config/homer:/www/assets:z'
    networks:
      - homer

networks:
  homer:
    name: homer
    external: false
